<!doctype html>
<!--
  Christine Jewell . Audio Concierge dashboard
  Single self-contained file, vanilla JS, mobile-first. Serve anywhere static.

  AUTH (magic-link style)
  The page is opened from a private link carrying ?key=<secret>. Every API call
  echoes it as:

      Authorization: Bearer <key>

  The backend validates against DASHBOARD_AUTH_SECRET. A 401 or 403 renders the
  invalid-link state. A missing key renders the ask-for-your-link state. The key
  is never rendered into the DOM.

  ENDPOINTS this page is built against. The backend should match these shapes.

  GET /api/dashboard/cohort
    {
      "generated_at": "2026-08-29T15:38:00Z",
      "optins": { "total": 128, "week": 31 },          // week = last 7 days
      "completed": 43,                                 // leads who finished day 7
      "tracks": { "A": 61, "B": 39, "C": 21, "pending": 7 },
          // pending = welcomed but no A/B/C choice yet
      "day_distribution": [7, 18, 15, 12, 11, 9, 7, 6],
          // active leads by current day; index 0 = welcomed not started, 1..7 in series
      "avg_listen_through_pct": 68,                    // mean max_progress_pct across deliveries
      "reply_rate_pct": 54,                            // share of leads with 1+ inbound reply
      "booked": 9,
      "enrolled": 4,
      "conversion_pct": 30.2                           // (booked + enrolled) / completed * 100
    }

  GET /api/dashboard/listeners
    {
      "listeners": [
        {
          "lead_id": "6f9d2c1e-....",
          "name": "Marcus T.",
          "track": "A",                    // "A" | "B" | "C" | null (not chosen yet)
          "day": 4,                        // 0..7
          "total_days": 7,
          "listen_through_pct": 82,        // mean max_progress_pct of their deliveries
          "replies_count": 6,              // total inbound messages
          "last_message": "That one about scorekeeping hit close.",
              // latest INBOUND body, null if they have never replied
          "last_message_at": "2026-08-29T12:15:00Z",   // null if none
          "status": "engaged"
              // engaged | warming | re-engage | crisis-flag | booked | enrolled
        }
      ]
    }
    The page sorts crisis-flag rows first, then by last_message_at descending.

  GET /api/dashboard/thread?lead_id=<uuid>
    {
      "lead": {
        "lead_id": "6f9d2c1e-....",
        "name": "Marcus T.",
        "phone_masked": "(***) ***-4821",
        "track": "A", "day": 4, "total_days": 7,
        "status": "engaged",
        "opted_in_at": "2026-08-25T13:02:00Z",
        "crisis_hold": false,              // true = automation paused, page shows a notice
        "crisis_notified_at": null         // iso timestamp when Christine and Shep were pinged
      },
      "days": [                            // one row per DELIVERED day, ascending
        {
          "day": 1,
          "episode_title": "The Roommate Drift",
          "delivered_at": "2026-08-26T11:30:00Z",
          "first_played_at": "2026-08-26T11:41:00Z",   // null = never played
          "listen_pct": 100,                           // max progress for that delivery
          "play_count": 2,
          "replied": true                              // any inbound that day
        }
      ],
      "messages": [                        // full SMS thread, ascending
        { "direction": "out", "body": "Morning Marcus. Day 1 is here...", "at": "2026-08-26T11:30:00Z" },
        { "direction": "in",  "body": "Listened on the drive.",           "at": "2026-08-26T12:04:00Z" }
      ]
      // direction "out" = the concierge in Christine's voice, "in" = the lead
    }

  PREVIEW
  Open dashboard.html?demo=1 for a fully rendered sample-data view. A badge
  reads "Sample data" and no network calls are made.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0805">
<meta name="color-scheme" content="dark">
<title>Audio Concierge &middot; Christine Jewell</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0805;
    --panel:#181008;
    --panel-2:#1f150b;
    --ink:#f2e9d8;
    --ink-dim:#b3a186;
    --ink-faint:#7c6c55;
    --gold:#b8964e;
    --gold-2:#d4b36a;
    --gold-deep:#8a6d33;
    --line:rgba(184,150,78,.18);
    --line-soft:rgba(242,233,216,.07);
    --red:#d64545;
    --red-ink:#ffe3dd;
    --green:#8fb996;
    --slate:#93a3b4;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(1200px 640px at 50% -14%, rgba(184,150,78,.13), transparent 60%),
      linear-gradient(#150e08, var(--bg) 480px);
    background-color:var(--bg);
    min-height:100dvh;-webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}

  /* ---------- header ---------- */
  .top{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px clamp(16px,4vw,32px);
    background:rgba(13,8,5,.82);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line-soft);
  }
  .brandrow{display:flex;align-items:center;gap:12px;min-width:0}
  .monogram{
    flex:none;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-style:italic;font-weight:500;font-size:14.5px;color:var(--gold-2);
  }
  .wordmark{
    font-size:10px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;
    color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .badge-demo{
    flex:none;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-2);border:1px solid var(--line);border-radius:999px;padding:4px 9px;
  }
  .topright{display:flex;align-items:center;gap:12px;flex:none}
  .refreshed{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
  .btn-refresh{
    display:flex;align-items:center;gap:7px;
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-2);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;transition:background .15s ease,color .15s ease;
  }
  .btn-refresh:hover{background:var(--gold);color:#1c1207}
  .btn-refresh:disabled{opacity:.45;pointer-events:none}
  .btn-refresh svg{width:12px;height:12px;fill:currentColor}
  @media (max-width:640px){.refreshed{display:none}}

  /* ---------- layout ---------- */
  .wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 80px}
  .hero{padding:38px 0 30px}
  .eyebrow{
    font-size:10.5px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;
    color:var(--gold-2);margin-bottom:12px;
  }
  h1{
    font-family:var(--serif);font-weight:600;font-size:clamp(34px,6vw,48px);
    line-height:1.08;letter-spacing:.004em;
  }
  .hero .sub{margin-top:10px;font-size:14.5px;color:var(--ink-dim);max-width:52ch;line-height:1.6}

  .sect{margin-top:34px}
  .sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
  .sect-title{
    font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.005em;
  }
  .sect-note{font-size:12px;color:var(--ink-faint)}
  .sect-note.alert{color:#e98a83;font-weight:500}

  /* ---------- cohort cards ---------- */
  .cards{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
  @media (min-width:860px){.cards{grid-template-columns:repeat(6,1fr);gap:14px}}
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line-soft);border-radius:14px;
    padding:16px 16px 14px;min-width:0;
  }
  .card .lbl{
    font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:10px;
  }
  .card .big{
    font-family:var(--serif);font-weight:600;font-size:34px;line-height:1;
    color:var(--ink);font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums tabular-nums;
  }
  .card .big .unit{font-size:20px;color:var(--ink-dim);margin-left:2px}
  .card .sub{margin-top:8px;font-size:11.5px;color:var(--ink-faint);line-height:1.45}
  .card.hero-card{
    grid-column:span 2;
    border-color:rgba(184,150,78,.45);
    background:
      radial-gradient(240px 140px at 85% -20%, rgba(212,179,106,.16), transparent 70%),
      linear-gradient(180deg,#241809,#1a1108);
    box-shadow:0 14px 40px rgba(0,0,0,.35);
  }
  .card.hero-card .big{font-size:44px;color:var(--gold-2)}
  .card.hero-card .lbl{color:var(--gold-2)}
  .card.wide{grid-column:span 2}
  @media (max-width:560px){body.demo .wordmark{display:none}}

  /* stacked track split */
  .stack{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:6px 0 14px;background:var(--line-soft)}
  .stack i{display:block;height:100%}
  .stack .sA{background:var(--gold-2)}
  .stack .sB{background:#e8dcc4}
  .stack .sC{background:var(--gold-deep)}
  .stack .sP{background:rgba(242,233,216,.16)}
  .legend{display:grid;gap:7px}
  .legend .li{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-dim)}
  .legend .dot{flex:none;width:8px;height:8px;border-radius:2px}
  .legend .cnt{margin-left:auto;color:var(--ink);font-weight:600}
  .legend .pcts{color:var(--ink-faint);width:44px;text-align:right}

  /* day distribution */
  .bars{display:flex;align-items:flex-end;gap:6px;height:86px;margin-top:6px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .bars .v{font-size:10px;color:var(--ink-faint)}
  .bars .bar{
    width:100%;max-width:34px;border-radius:4px 4px 2px 2px;
    background:linear-gradient(180deg,var(--gold-2),var(--gold-deep));
    min-height:3px;opacity:.92;
  }
  .bars .col.zero .bar{background:var(--line-soft)}
  .bars .x{font-size:10px;color:var(--ink-faint);letter-spacing:.05em}

  /* ---------- listener list ---------- */
  .toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  @media (min-width:860px){.toolbar{flex-direction:row;align-items:center}}
  .search{
    flex:1;display:flex;align-items:center;gap:9px;
    background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
    padding:10px 13px;
  }
  .search svg{width:14px;height:14px;fill:var(--ink-faint);flex:none}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--ink);
    font:inherit;font-size:13.5px;min-width:0;
  }
  .search input::placeholder{color:var(--ink-faint)}
  .search:focus-within{border-color:rgba(184,150,78,.5)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{
    flex:none;font-size:11px;font-weight:600;letter-spacing:.05em;
    color:var(--ink-dim);border:1px solid var(--line-soft);border-radius:999px;
    padding:7px 13px;transition:all .15s ease;
  }
  .fchip:hover{border-color:var(--line)}
  .fchip.on{background:var(--gold);border-color:var(--gold);color:#1c1207}
  .fchip.on.crisis{background:var(--red);border-color:var(--red);color:var(--red-ink)}

  .listbox{
    background:var(--panel);border:1px solid var(--line-soft);
    border-radius:14px;overflow:hidden;
  }
  .cols{
    display:none;
    padding:11px 18px;border-bottom:1px solid var(--line-soft);
    font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);
  }
  .row{
    display:grid;width:100%;text-align:left;
    padding:14px 16px;border-bottom:1px solid var(--line-soft);
    grid-template-columns:1fr auto;
    grid-template-areas:"name status" "meta meta" "msg msg";
    gap:9px 10px;align-items:center;
    transition:background .12s ease;
  }
  .row:last-child{border-bottom:none}
  .row:hover{background:rgba(184,150,78,.05)}
  .row:focus-visible{outline:2px solid var(--gold-2);outline-offset:-2px}
  .row.crisis{
    background:linear-gradient(90deg,rgba(214,69,69,.12),rgba(214,69,69,.03) 60%);
    box-shadow:inset 3px 0 0 var(--red);
  }
  .row.crisis:hover{background:linear-gradient(90deg,rgba(214,69,69,.17),rgba(214,69,69,.05) 60%)}

  .c-name{grid-area:name;min-width:0;display:flex;flex-direction:column;gap:2px}
  .c-name strong{font-size:14.5px;font-weight:600;letter-spacing:.005em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-name .track{font-size:11px;color:var(--ink-faint)}
  .c-day{grid-area:day;font-size:12.5px;color:var(--ink-dim);white-space:nowrap}
  .c-day b{color:var(--ink);font-weight:600}
  .c-listen{grid-area:listen;display:flex;align-items:center;gap:9px;min-width:0}
  .bar{
    flex:1;max-width:150px;height:5px;border-radius:999px;
    background:rgba(242,233,216,.1);overflow:hidden;
  }
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-2))}
  .c-listen .pct{font-size:12px;color:var(--ink-dim);width:38px;text-align:right;flex:none}
  .c-replies{grid-area:replies;font-size:12.5px;color:var(--ink-dim);white-space:nowrap}
  .c-replies b{color:var(--ink);font-weight:600}
  .c-msg{grid-area:msg;display:flex;align-items:baseline;gap:10px;min-width:0}
  .c-msg .txt{
    flex:1;min-width:0;font-size:13px;color:var(--ink-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .c-msg .txt.none{color:var(--ink-faint);font-style:italic}
  .c-msg .when{flex:none;font-size:11px;color:var(--ink-faint)}
  .c-status{grid-area:status;justify-self:end}

  .meta-wrap{grid-area:meta;display:flex;align-items:center;gap:14px;min-width:0}
  .meta-wrap .c-listen{flex:1}

  @media (min-width:860px){
    .cols{display:grid;grid-template-columns:1.25fr 92px 190px 84px 2fr 112px;gap:14px}
    .row{
      grid-template-columns:1.25fr 92px 190px 84px 2fr 112px;
      grid-template-areas:"name day listen replies msg status";
      gap:14px;padding:13px 18px;
    }
    .meta-wrap{display:contents}
    .lbl-m{display:none}
  }
  @media (max-width:859px){
    .c-day .of{color:var(--ink-faint)}
  }

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    border-radius:999px;padding:5px 11px;white-space:nowrap;
  }
  .chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .chip.engaged{color:var(--green);background:rgba(143,185,150,.1);border:1px solid rgba(143,185,150,.25)}
  .chip.warming{color:var(--gold-2);background:rgba(212,179,106,.1);border:1px solid rgba(212,179,106,.28)}
  .chip.re-engage{color:var(--slate);background:rgba(147,163,180,.1);border:1px solid rgba(147,163,180,.24)}
  .chip.booked{color:#1c1207;background:var(--gold);border:1px solid var(--gold)}
  .chip.booked::before{background:#1c1207}
  .chip.enrolled{color:#1c1207;background:var(--gold-2);border:1px solid var(--gold-2);box-shadow:0 0 16px rgba(212,179,106,.35)}
  .chip.enrolled::before{background:#1c1207}
  .chip.crisis-flag{
    color:var(--red-ink);background:var(--red);border:1px solid #e05c5c;
    box-shadow:0 0 18px rgba(214,69,69,.45);
  }
  .chip.crisis-flag::before{background:var(--red-ink)}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px}

  /* ---------- slide-over panel ---------- */
  .scrim{
    position:fixed;inset:0;z-index:60;background:rgba(8,5,3,.6);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .scrim.open{opacity:1;pointer-events:auto}
  .panel{
    position:fixed;top:0;right:0;bottom:0;z-index:70;
    width:min(540px,100%);
    background:linear-gradient(180deg,#1b120a,#140d07);
    border-left:1px solid var(--line);
    box-shadow:-40px 0 80px rgba(0,0,0,.55);
    transform:translateX(103%);
    transition:transform .32s cubic-bezier(.32,.72,.28,1);
    display:flex;flex-direction:column;
  }
  .panel.open{transform:none}
  .panel-head{
    flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:22px 22px 0;
  }
  .btn-close{
    flex:none;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);transition:all .15s ease;
  }
  .btn-close:hover{border-color:var(--line);color:var(--ink)}
  .btn-close svg{width:13px;height:13px;fill:currentColor}
  .panel-scroll{flex:1;overflow-y:auto;padding:0 22px calc(30px + env(safe-area-inset-bottom));overscroll-behavior:contain}
  .p-name{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.1;margin-bottom:7px}
  .p-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
  .p-meta .sep{color:var(--ink-faint)}
  .hold{
    margin:16px 0 4px;padding:13px 15px;border-radius:11px;
    background:rgba(214,69,69,.13);border:1px solid rgba(214,69,69,.4);
    color:var(--red-ink);font-size:12.5px;line-height:1.55;
  }
  .p-sect{margin-top:26px}
  .p-sect-title{
    font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold-2);margin-bottom:12px;
    display:flex;align-items:center;gap:12px;
  }
  .p-sect-title::after{content:"";flex:1;height:1px;background:var(--line-soft)}

  .dayrow{
    padding:11px 0;border-bottom:1px solid var(--line-soft);
    display:flex;flex-direction:column;gap:7px;
  }
  .dayrow:last-child{border-bottom:none}
  .d-top{display:flex;align-items:baseline;gap:10px;min-width:0}
  .d-num{flex:none;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--gold-2);width:48px}
  .d-title{flex:1;min-width:0;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-rep{flex:none;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .d-rep.yes{color:var(--green)}
  .d-rep.no{color:var(--ink-faint)}
  .d-mid{display:flex;align-items:center;gap:10px}
  .d-mid .bar{max-width:none}
  .d-mid .pct{flex:none;font-size:12px;color:var(--ink-dim);width:38px;text-align:right}
  .d-mid .plays{flex:none;font-size:11.5px;color:var(--ink-faint);width:56px;text-align:right}
  .d-sub{font-size:11px;color:var(--ink-faint);padding-left:58px}
  @media (max-width:420px){.d-sub{padding-left:0}}

  .legendline{font-size:11.5px;color:var(--ink-faint);margin-bottom:14px}
  .legendline b{color:var(--gold-2);font-weight:600}
  .datechip{
    text-align:center;margin:18px 0 10px;
    font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
  }
  .msg{max-width:82%;margin-bottom:3px}
  .msg .bub{
    padding:10px 14px;border-radius:16px;
    font-size:13.5px;line-height:1.5;word-wrap:break-word;
  }
  .msg .t{font-size:10px;color:var(--ink-faint);margin-top:3px;padding:0 5px}
  .msg.in{margin-right:auto}
  .msg.in .bub{
    background:#251a10;border:1px solid var(--line-soft);
    border-bottom-left-radius:5px;color:var(--ink);
  }
  .msg.out{margin-left:auto;text-align:right}
  .msg.out .bub{
    text-align:left;
    background:linear-gradient(180deg,rgba(212,179,106,.22),rgba(184,150,78,.13));
    border:1px solid rgba(212,179,106,.26);
    border-bottom-right-radius:5px;color:var(--ink);
  }
  .thread-gap{height:6px}

  /* ---------- states ---------- */
  .gate{
    min-height:76dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 26px;
  }
  .gate .monogram{width:46px;height:46px;font-size:19px;margin-bottom:22px}
  .gate h2{font-family:var(--serif);font-weight:600;font-size:clamp(27px,6.4vw,34px);line-height:1.2;margin-bottom:12px;max-width:22ch}
  .gate p{font-size:14px;color:var(--ink-dim);max-width:38ch;line-height:1.65}

  .err{
    padding:26px 20px;text-align:center;color:var(--ink-dim);font-size:13.5px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .btn-ghost{
    font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold-2);border:1px solid var(--line);border-radius:999px;padding:9px 18px;
    transition:all .15s ease;
  }
  .btn-ghost:hover{background:var(--gold);color:#1c1207}

  .skel{border-radius:10px;background:linear-gradient(90deg,rgba(242,233,216,.05) 25%,rgba(242,233,216,.1) 50%,rgba(242,233,216,.05) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brandrow">
    <div class="monogram" aria-hidden="true">CJ</div>
    <div class="wordmark">Christine Jewell</div>
    <span class="badge-demo" id="badge-demo" hidden>Sample data</span>
  </div>
  <div class="topright">
    <span class="refreshed num" id="refreshed"></span>
    <button class="btn-refresh" id="btn-refresh" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Refresh
    </button>
  </div>
</header>

<div class="wrap" id="app">
  <section class="hero">
    <p class="eyebrow">Audio Concierge</p>
    <h1>Seven days, one voice.</h1>
    <p class="sub">Every listener in the daily audio series, how far they went, what they said back, and where each one stands today.</p>
  </section>

  <section class="sect" id="sect-cohort" aria-labelledby="cohort-title">
    <div class="sect-head">
      <h2 class="sect-title" id="cohort-title">The cohort</h2>
      <span class="sect-note" id="cohort-note"></span>
    </div>
    <div id="cohort-body"></div>
  </section>

  <section class="sect" id="sect-listeners" aria-labelledby="listeners-title">
    <div class="sect-head">
      <h2 class="sect-title" id="listeners-title">Listeners</h2>
      <span class="sect-note" id="listeners-note"></span>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input type="search" id="q" placeholder="Search a name or a message" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
    </div>
    <div id="listeners-body"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Listener detail">
  <div class="panel-head">
    <div id="panel-title-zone" style="min-width:0"></div>
    <button class="btn-close" id="btn-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div class="panel-scroll" id="panel-body"></div>
</aside>

<noscript><div class="gate"><h2>This dashboard needs JavaScript.</h2></div></noscript>

<script>
(function () {
  "use strict";

  /* ================= config, auth ================= */
  var params = new URLSearchParams(location.search);
  var DEMO = params.get("demo") === "1";
  var KEY = params.get("key") || "";

  var app = document.getElementById("app");

  var TRACKS = { A: "Marriage", B: "Leadership", C: "Health" };
  var STATUS = {
    "engaged":     { label: "Engaged" },
    "warming":     { label: "Warming" },
    "re-engage":   { label: "Re-engage" },
    "crisis-flag": { label: "Crisis" },
    "booked":      { label: "Booked" },
    "enrolled":    { label: "Enrolled" }
  };

  if (DEMO) {
    document.getElementById("badge-demo").hidden = false;
    document.body.classList.add("demo");
  }

  if (!DEMO && !KEY) {
    gate("This dashboard opens from a private link.",
         "Your link carries its own key. Use the newest dashboard link you were sent, and it will open straight to your listeners.");
    return;
  }

  function gate(title, body) {
    app.innerHTML =
      '<div class="gate">' +
        '<div class="monogram" aria-hidden="true">CJ</div>' +
        "<h2>" + esc(title) + "</h2>" +
        "<p>" + esc(body) + "</p>" +
      "</div>";
    document.getElementById("btn-refresh").disabled = true;
  }

  function api(path) {
    if (DEMO) return demoApi(path);
    return fetch(path, { headers: { "Authorization": "Bearer " + KEY } }).then(function (r) {
      if (r.status === 401 || r.status === 403) { var e = new Error("auth"); e.auth = true; throw e; }
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  /* ================= helpers ================= */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtInt(n) { return (n == null || isNaN(n)) ? "0" : Number(n).toLocaleString("en-US"); }
  function fmtPct(n) {
    if (n == null || isNaN(n)) return "0";
    return (Math.round(n * 10) / 10).toLocaleString("en-US", { maximumFractionDigits: 1 });
  }
  function tShort(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }
  function dShort(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }
  function ago(iso) {
    if (!iso) return "";
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return "now";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    if (s < 86400 * 7) return Math.floor(s / 86400) + "d";
    return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function trackLine(t) {
    if (!t) return "No track yet";
    return "Track " + t + ", " + (TRACKS[t] || "");
  }
  function chipHtml(status) {
    var m = STATUS[status] || { label: status || "?" };
    return '<span class="chip ' + esc(status) + '">' + esc(m.label) + "</span>";
  }

  /* ================= cohort ================= */
  var cohortBody = document.getElementById("cohort-body");
  var cohortNote = document.getElementById("cohort-note");

  function cohortSkeleton() {
    var s = '<div class="cards">';
    for (var i = 0; i < 6; i++) s += '<div class="skel" style="height:104px"></div>';
    s += '<div class="skel wide" style="height:170px;grid-column:span 2"></div>' +
         '<div class="skel wide" style="height:170px;grid-column:span 2"></div></div>';
    cohortBody.innerHTML = s;
  }

  function renderCohort(c) {
    var tr = c.tracks || {};
    var totTracks = (tr.A || 0) + (tr.B || 0) + (tr.C || 0) + (tr.pending || 0);
    function w(n) { return totTracks ? (n / totTracks * 100) : 0; }
    function pc(n) { return totTracks ? Math.round(n / totTracks * 100) + "%" : "0%"; }

    var dist = c.day_distribution || [];
    var max = Math.max.apply(null, dist.concat([1]));
    var distHtml = "";
    for (var i = 0; i < dist.length; i++) {
      var hgt = Math.max(3, Math.round(dist[i] / max * 54));
      var lab = i === 0 ? "W" : String(i);
      var ttl = i === 0 ? "Welcomed, track not chosen: " + dist[i] : "Day " + i + ": " + dist[i];
      distHtml +=
        '<div class="col' + (dist[i] === 0 ? " zero" : "") + '" title="' + esc(ttl) + '">' +
          '<span class="v num">' + fmtInt(dist[i]) + "</span>" +
          '<span class="bar" style="height:' + hgt + 'px"></span>' +
          '<span class="x">' + lab + "</span>" +
        "</div>";
    }

    var converted = (c.booked || 0) + (c.enrolled || 0);

    cohortBody.innerHTML =
      '<div class="cards">' +

        '<div class="card"><div class="lbl">Opt-ins</div>' +
          '<div class="big num">' + fmtInt(c.optins && c.optins.total) + "</div>" +
          '<div class="sub num">+' + fmtInt(c.optins && c.optins.week) + " in the last 7 days</div></div>" +

        '<div class="card"><div class="lbl">Listen-through</div>' +
          '<div class="big num">' + fmtPct(c.avg_listen_through_pct) + '<span class="unit">%</span></div>' +
          '<div class="sub">average across every delivered track</div></div>' +

        '<div class="card"><div class="lbl">Reply rate</div>' +
          '<div class="big num">' + fmtPct(c.reply_rate_pct) + '<span class="unit">%</span></div>' +
          '<div class="sub">have written back at least once</div></div>' +

        '<div class="card"><div class="lbl">Booked</div>' +
          '<div class="big num">' + fmtInt(c.booked) + "</div>" +
          '<div class="sub">calls on the calendar</div></div>' +

        '<div class="card"><div class="lbl">Enrolled</div>' +
          '<div class="big num">' + fmtInt(c.enrolled) + "</div>" +
          '<div class="sub">in the program</div></div>' +

        '<div class="card"><div class="lbl">Completed</div>' +
          '<div class="big num">' + fmtInt(c.completed) + "</div>" +
          '<div class="sub">finished all seven days</div></div>' +

        '<div class="card hero-card"><div class="lbl">Conversion</div>' +
          '<div class="big num">' + fmtPct(c.conversion_pct) + '<span class="unit">%</span></div>' +
          '<div class="sub num">' + fmtInt(converted) + " of " + fmtInt(c.completed) +
          " who finished the series booked or enrolled. This is the number.</div></div>" +

        '<div class="card wide"><div class="lbl">Track split</div>' +
          '<div class="stack" aria-hidden="true">' +
            '<i class="sA" style="width:' + w(tr.A || 0) + '%"></i>' +
            '<i class="sB" style="width:' + w(tr.B || 0) + '%"></i>' +
            '<i class="sC" style="width:' + w(tr.C || 0) + '%"></i>' +
            '<i class="sP" style="width:' + w(tr.pending || 0) + '%"></i>' +
          "</div>" +
          '<div class="legend">' +
            legendRow("sA", "A · Marriage", tr.A || 0, pc(tr.A || 0)) +
            legendRow("sB", "B · Leadership", tr.B || 0, pc(tr.B || 0)) +
            legendRow("sC", "C · Health", tr.C || 0, pc(tr.C || 0)) +
            legendRow("sP", "Still deciding", tr.pending || 0, pc(tr.pending || 0)) +
          "</div></div>" +

        '<div class="card wide"><div class="lbl">Where everyone is</div>' +
          '<div class="bars">' + distHtml + "</div>" +
          '<div class="sub" style="margin-top:10px">active listeners by day of the series. W is welcomed, no track chosen yet.</div></div>' +

      "</div>";

    cohortNote.textContent = "";
    setRefreshed(c.generated_at);
  }

  function legendRow(cls, label, count, pct) {
    return '<div class="li"><span class="dot ' + cls + '"></span>' + esc(label) +
           '<span class="pcts num">' + pct + '</span><span class="cnt num">' + fmtInt(count) + "</span></div>";
  }

  /* ================= listeners ================= */
  var listenersBody = document.getElementById("listeners-body");
  var listenersNote = document.getElementById("listeners-note");
  var toolbar = document.getElementById("toolbar");
  var qInput = document.getElementById("q");
  var chipsEl = document.getElementById("chips");

  var allListeners = [];
  var filter = { q: "", status: "all" };

  var FILTERS = [
    { id: "all", label: "All" },
    { id: "crisis-flag", label: "Crisis", cls: "crisis" },
    { id: "engaged", label: "Engaged" },
    { id: "warming", label: "Warming" },
    { id: "re-engage", label: "Re-engage" },
    { id: "booked", label: "Booked" },
    { id: "enrolled", label: "Enrolled" }
  ];

  function renderChips() {
    chipsEl.innerHTML = FILTERS.map(function (f) {
      return '<button type="button" class="fchip' + (f.cls ? " " + f.cls : "") +
             (filter.status === f.id ? " on" : "") + '" data-f="' + f.id + '">' + esc(f.label) + "</button>";
    }).join("");
  }
  chipsEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-f]");
    if (!b) return;
    filter.status = b.getAttribute("data-f");
    renderChips(); renderRows();
  });
  qInput.addEventListener("input", function () {
    filter.q = qInput.value.trim().toLowerCase();
    renderRows();
  });

  function listenersSkeleton() {
    var s = "";
    for (var i = 0; i < 6; i++) s += '<div class="skel" style="height:64px;margin-bottom:10px"></div>';
    listenersBody.innerHTML = s;
  }

  function sortListeners(list) {
    return list.slice().sort(function (a, b) {
      var ac = a.status === "crisis-flag" ? 0 : 1;
      var bc = b.status === "crisis-flag" ? 0 : 1;
      if (ac !== bc) return ac - bc;
      var at = a.last_message_at ? new Date(a.last_message_at).getTime() : 0;
      var bt = b.last_message_at ? new Date(b.last_message_at).getTime() : 0;
      return bt - at;
    });
  }

  function renderRows() {
    var list = sortListeners(allListeners).filter(function (l) {
      if (filter.status !== "all" && l.status !== filter.status) return false;
      if (filter.q) {
        var hay = (l.name + " " + (l.last_message || "")).toLowerCase();
        if (hay.indexOf(filter.q) === -1) return false;
      }
      return true;
    });

    var crisisN = allListeners.filter(function (l) { return l.status === "crisis-flag"; }).length;
    listenersNote.className = "sect-note" + (crisisN ? " alert" : "");
    listenersNote.textContent = crisisN
      ? crisisN + (crisisN === 1 ? " thread needs eyes now" : " threads need eyes now")
      : fmtInt(allListeners.length) + " people in the series";

    if (!list.length) {
      listenersBody.innerHTML =
        '<div class="listbox"><div class="empty">' +
        (allListeners.length ? "No one matches that filter." :
         "No listeners yet. The first opt-ins will appear here.") +
        "</div></div>";
      return;
    }

    var head =
      '<div class="cols" aria-hidden="true"><span>Listener</span><span>Day</span>' +
      "<span>Listened</span><span>Replies</span><span>Last message</span>" +
      '<span style="text-align:right">Status</span></div>';

    var rows = list.map(function (l) {
      var msgTxt = l.last_message
        ? '<span class="txt">&ldquo;' + esc(l.last_message) + "&rdquo;</span>"
        : '<span class="txt none">No replies yet</span>';
      return (
        '<button type="button" class="row' + (l.status === "crisis-flag" ? " crisis" : "") +
        '" data-id="' + esc(l.lead_id) + '">' +
          '<span class="c-name"><strong>' + esc(l.name) + "</strong>" +
            '<span class="track">' + esc(trackLine(l.track)) + "</span></span>" +
          '<span class="meta-wrap">' +
            '<span class="c-day num"><span class="lbl-m">Day </span><b>' + l.day + '</b><span class="of">/' + (l.total_days || 7) + "</span></span>" +
            '<span class="c-listen"><span class="bar"><i style="width:' + Math.min(100, l.listen_through_pct || 0) + '%"></i></span>' +
              '<span class="pct num">' + Math.round(l.listen_through_pct || 0) + "%</span></span>" +
            '<span class="c-replies num"><b>' + fmtInt(l.replies_count) + '</b><span class="lbl-m">' + (l.replies_count === 1 ? " reply" : " replies") + "</span></span>" +
          "</span>" +
          '<span class="c-msg">' + msgTxt +
            '<span class="when num">' + ago(l.last_message_at) + "</span></span>" +
          '<span class="c-status">' + chipHtml(l.status) + "</span>" +
        "</button>"
      );
    }).join("");

    listenersBody.innerHTML = '<div class="listbox">' + head + rows + "</div>";
  }

  listenersBody.addEventListener("click", function (e) {
    var r = e.target.closest("[data-id]");
    if (r) openPanel(r.getAttribute("data-id"));
  });

  /* ================= slide-over ================= */
  var panel = document.getElementById("panel");
  var scrim = document.getElementById("scrim");
  var panelBody = document.getElementById("panel-body");
  var panelTitleZone = document.getElementById("panel-title-zone");
  var btnClose = document.getElementById("btn-close");
  var lastFocus = null;

  function openPanel(leadId) {
    lastFocus = document.activeElement;
    panel.classList.add("open");
    scrim.classList.add("open");
    document.body.style.overflow = "hidden";
    btnClose.focus();

    panelTitleZone.innerHTML = "";
    panelBody.innerHTML =
      '<div class="skel" style="height:30px;margin-top:4px"></div>' +
      '<div class="skel" style="height:15px;margin-top:12px;width:70%"></div>' +
      '<div class="skel" style="height:210px;margin-top:26px"></div>' +
      '<div class="skel" style="height:260px;margin-top:20px"></div>';

    api("https://uzhnlbzhpcejpwfmzlas.supabase.co/functions/v1/cj-funnel/api/dashboard/thread?lead_id=" + encodeURIComponent(leadId))
      .then(renderThread)
      .catch(function (err) {
        if (err.auth) { closePanel(); authGate(); return; }
        panelBody.innerHTML =
          '<div class="err" style="margin-top:40px">This thread would not load.' +
          '<button type="button" class="btn-ghost" id="retry-thread">Try again</button></div>';
        var rb = document.getElementById("retry-thread");
        if (rb) rb.addEventListener("click", function () { openPanel(leadId); });
      });
  }

  function closePanel() {
    panel.classList.remove("open");
    scrim.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  btnClose.addEventListener("click", closePanel);
  scrim.addEventListener("click", closePanel);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && panel.classList.contains("open")) closePanel();
  });

  function renderThread(t) {
    var lead = t.lead || {};
    panelTitleZone.innerHTML =
      '<div class="p-name">' + esc(lead.name || "Listener") + "</div>" +
      '<div class="p-meta num">' +
        "<span>" + esc(lead.phone_masked || "") + "</span>" +
        '<span class="sep">&middot;</span><span>' + esc(trackLine(lead.track)) + "</span>" +
        '<span class="sep">&middot;</span><span>Day ' + (lead.day || 0) + " of " + (lead.total_days || 7) + "</span>" +
        "<span>" + chipHtml(lead.status) + "</span>" +
      "</div>";

    var html = "";

    if (lead.crisis_hold || lead.status === "crisis-flag") {
      var when = lead.crisis_notified_at
        ? " Christine and Shep were notified " + dShort(lead.crisis_notified_at) + " at " + tShort(lead.crisis_notified_at) + "."
        : " Christine and Shep were notified.";
      html +=
        '<div class="hold"><strong>Automation is paused for this thread.</strong>' + esc(when) +
        " Every reply here stays human until the hold is cleared.</div>";
    }

    /* the seven days */
    html += '<div class="p-sect"><div class="p-sect-title">The seven days</div>';
    var days = t.days || [];
    if (!days.length) {
      html += '<div class="empty" style="padding:18px 0;text-align:left">Nothing delivered yet.</div>';
    } else {
      html += days.map(function (d) {
        var played = d.first_played_at
          ? "Played " + tShort(d.first_played_at)
          : "Not played yet";
        var playsN = d.play_count || 0;
        return (
          '<div class="dayrow">' +
            '<div class="d-top"><span class="d-num num">Day ' + d.day + "</span>" +
              '<span class="d-title">' + esc(d.episode_title || "") + "</span>" +
              '<span class="d-rep ' + (d.replied ? "yes" : "no") + '">' + (d.replied ? "Replied" : "No reply") + "</span></div>" +
            '<div class="d-mid"><span class="bar"><i style="width:' + Math.min(100, d.listen_pct || 0) + '%"></i></span>' +
              '<span class="pct num">' + Math.round(d.listen_pct || 0) + "%</span>" +
              '<span class="plays num">' + playsN + (playsN === 1 ? " play" : " plays") + "</span></div>" +
            '<div class="d-sub num">Sent ' + dShort(d.delivered_at) + ", " + tShort(d.delivered_at) +
              " &middot; " + esc(played) + "</div>" +
          "</div>"
        );
      }).join("");
    }
    html += "</div>";

    /* the conversation */
    html += '<div class="p-sect"><div class="p-sect-title">The conversation</div>' +
            '<div class="legendline"><b>Gold</b> is the concierge in Christine’s voice.</div>';
    var msgs = t.messages || [];
    if (!msgs.length) {
      html += '<div class="empty" style="padding:18px 0;text-align:left">No messages yet.</div>';
    } else {
      var lastDay = "";
      html += msgs.map(function (m) {
        var out = "";
        var dayLabel = dShort(m.at);
        if (dayLabel !== lastDay) {
          out += '<div class="datechip">' + esc(dayLabel) + "</div>";
          lastDay = dayLabel;
        }
        out +=
          '<div class="msg ' + (m.direction === "out" ? "out" : "in") + '">' +
            '<div class="bub">' + esc(m.body) + "</div>" +
            '<div class="t num">' + tShort(m.at) + "</div>" +
          "</div>";
        return out;
      }).join("");
      html += '<div class="thread-gap"></div>';
    }
    html += "</div>";

    panelBody.innerHTML = html;
    panelBody.scrollTop = 0;
  }

  /* ================= load orchestration ================= */
  var refreshedEl = document.getElementById("refreshed");
  var btnRefresh = document.getElementById("btn-refresh");

  function setRefreshed(iso) {
    refreshedEl.textContent = "Refreshed " + tShort(iso || new Date().toISOString());
  }

  function authGate() {
    gate("This link is no longer valid.",
         "Dashboard keys rotate for safety. Grab the newest dashboard link you were sent and open that one instead.");
  }

  function loadAll() {
    btnRefresh.disabled = true;
    cohortSkeleton();
    listenersSkeleton();
    toolbar.hidden = true;

    var pCohort = api("https://uzhnlbzhpcejpwfmzlas.supabase.co/functions/v1/cj-funnel/api/dashboard/cohort").then(renderCohort);
    var pList = api("https://uzhnlbzhpcejpwfmzlas.supabase.co/functions/v1/cj-funnel/api/dashboard/listeners").then(function (d) {
      allListeners = (d && d.listeners) || [];
      toolbar.hidden = false;
      renderChips();
      renderRows();
    });

    Promise.allSettled([pCohort, pList]).then(function (results) {
      btnRefresh.disabled = false;
      var authFail = results.some(function (r) { return r.status === "rejected" && r.reason && r.reason.auth; });
      if (authFail) { authGate(); return; }
      if (results[0].status === "rejected") {
        cohortBody.innerHTML =
          '<div class="listbox"><div class="err">The cohort numbers would not load.' +
          '<button type="button" class="btn-ghost" id="retry-cohort">Try again</button></div></div>';
        document.getElementById("retry-cohort").addEventListener("click", loadAll);
      }
      if (results[1].status === "rejected") {
        listenersBody.innerHTML =
          '<div class="listbox"><div class="err">The listener list would not load.' +
          '<button type="button" class="btn-ghost" id="retry-list">Try again</button></div></div>';
        document.getElementById("retry-list").addEventListener("click", loadAll);
      }
      setRefreshed(new Date().toISOString());
    });
  }
  btnRefresh.addEventListener("click", loadAll);
  loadAll();

  /* ================= demo data (only with ?demo=1) ================= */
  function demoApi(path) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        try {
          if (path === "https://uzhnlbzhpcejpwfmzlas.supabase.co/functions/v1/cj-funnel/api/dashboard/cohort") resolve(demoCohort());
          else if (path === "https://uzhnlbzhpcejpwfmzlas.supabase.co/functions/v1/cj-funnel/api/dashboard/listeners") resolve({ listeners: demoListeners() });
          else if (path.indexOf("https://uzhnlbzhpcejpwfmzlas.supabase.co/functions/v1/cj-funnel/api/dashboard/thread") === 0) {
            var id = new URLSearchParams(path.split("?")[1] || "").get("lead_id");
            resolve(demoThread(id));
          }
          else reject(new Error("unknown " + path));
        } catch (e) { reject(e); }
      }, 260);
    });
  }

  function L(id, name, track, day, listen, replies, msg, msgAt, status) {

  function demoThread(id) {
    if (id === "marcus") return marcusThread();

  function D(day, track, sent, played, pct, plays, replied) {
    return {
      day: day, episode_title: EPISODES[track][day - 1],
      delivered_at: sent, first_played_at: played,
      listen_pct: pct, play_count: plays, replied: replied
    };
  }
  function M(dir, when, body) { return { direction: dir, body: body, at: when }; }

  function synthThread(l) {
    var lead = {
      lead_id: l.lead_id, name: l.name, phone_masked: "(***) ***-" + String(3100 + l.name.length * 47).slice(-4),
      track: l.track, day: l.day, total_days: 7, status: l.status,
      opted_in_at: at(l.day + 1, 12, 15), crisis_hold: false, crisis_notified_at: null
    };
    var days = [], messages = [];
    var first = l.name.split(" ")[0];
    for (var n = 1; n <= Math.max(l.day, 1); n++) {
      var back = l.day - n;
      var jitter = ((n * 37 + l.name.length * 13) % 30) - 15;
      var pct = Math.max(0, Math.min(100, (l.listen_through_pct || 0) + jitter));
      var playedAt = pct > 0 ? at(back, 8, 10 + (n * 7) % 40) : null;
      var replied = l.replies_count > 0 && n % 2 === 1;
      days.push(D(n, l.track || "A", at(back, 7, 30), playedAt, pct, pct > 0 ? 1 + (n % 2) : 0, replied));
      messages.push(M("out", at(back, 7, 30),
        "Day " + n + ", " + first + ": " + EPISODES[l.track || "A"][n - 1] +
        ". https://go.thechristinejewell.com/d/x" + n + l.lead_id.slice(0, 2)));
    }
    if (l.last_message) messages.push(M("in", l.last_message_at, l.last_message));
    return { lead: lead, days: days, messages: messages };
  }
