<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Daily Whisper</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{--ground:#eceef2;--surface:#fff;--ink:#171a21;--ink-soft:#414957;--muted:#6b7383;--rule:#d9dde5;--brass:#9a7a34;--brass-bright:#b8964e;--brass-wash:#f7f1e3}
@media (prefers-color-scheme:dark){:root{--ground:#0f1218;--surface:#181c24;--ink:#e8ebf1;--ink-soft:#b4bbc9;--muted:#8a92a3;--rule:#2a303b;--brass:#d9b978;--brass-bright:#e7cb90;--brass-wash:#2a2417}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;padding:24px}
.card{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--rule);padding:34px 30px 30px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0 0 10px}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.1;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
p{margin:0 0 12px;color:var(--ink-soft)}
.phone{display:inline-block;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;color:var(--ink);margin:4px 0}
a.btn{display:inline-block;margin-top:8px;background:var(--brass-bright);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}
a.btn:hover{background:var(--brass)}
.sig{font-family:Fraunces,Georgia,serif;margin-top:22px;color:var(--ink)}
.fine{font-size:13px;color:var(--muted);margin-top:18px;border-top:1px solid var(--rule);padding-top:14px}
form{display:grid;gap:10px;margin:14px 0 6px}
input{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:10px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
input:focus{outline:2px solid var(--brass);outline-offset:1px}
button.btn{background:var(--brass-bright);color:#fff;border:none;font:inherit;font-weight:700;padding:12px 22px;border-radius:10px;cursor:pointer}
button.btn:hover{background:var(--brass)} button.btn:disabled{opacity:.5}
.or{font-size:13.5px;color:var(--muted);margin-top:14px}
.err{color:#a33b2c;font-weight:600;font-size:14.5px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
</style></head><body>
<div class="card" id="card"><p class="eyebrow">The Daily Whisper</p><h1 id="h">One moment.</h1><div id="body"></div><p class="sig">Christine</p>
<p class="fine">Ten mornings, about ten minutes each, by text. Reply STOP to any of them to opt out.</p></div>
<script>
var q=new URLSearchParams(location.search), s=q.get("s")||"", n=q.get("n")||"";
var hi=n?"Hey "+n+". ":"";
var API="https://uzhnlbzhpcejpwfmzlas.supabase.co/functions/v1/cj-funnel/";
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var H=document.getElementById("h"),B=document.getElementById("body");
var e=q.get("e")||"";
function askPhone(intro){
  B.innerHTML='<p>'+intro+'</p>'+
   '<form id="f" autocomplete="on">'+
   '<input id="first" placeholder="First name" value="'+esc(n)+'" autocomplete="given-name">'+
   '<input id="phone" type="tel" placeholder="Mobile number" autocomplete="tel" required>'+
   '<input class="hp" id="website" tabindex="-1" autocomplete="off">'+
   '<button class="btn" id="go">Send me the first one</button>'+
   '<div class="err" id="err"></div></form>'+
   '<p class="or" id="num">Or text the word <b>DAILY</b> to my number.</p>';
  fetch(API+"api/public/number").then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok){document.getElementById("num").innerHTML='Or just text the word <b>DAILY</b> to <span class="phone">'+esc(j.pretty)+'</span> <a class="btn" href="sms:'+esc(j.e164)+'&body=DAILY">Open my messages</a>'}
  }).catch(function(){});
  document.getElementById("f").addEventListener("submit",function(ev){
    ev.preventDefault();
    var go=document.getElementById("go"),err=document.getElementById("err");
    go.disabled=true;go.textContent="One moment...";err.textContent="";
    fetch(API+"join-phone",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({first:document.getElementById("first").value,phone:document.getElementById("phone").value,email:e,website:document.getElementById("website").value})})
     .then(function(r){return r.json()}).then(function(j){
        if(j&&j.ok){ var nn=j.first||document.getElementById("first").value.trim(); location.replace("joined.html?s="+encodeURIComponent(j.state||"sent")+(nn?"&n="+encodeURIComponent(nn):"")) }
        else{ err.textContent=(j&&j.error)||"That didn't go through. Text DAILY instead."; go.disabled=false; go.textContent="Send me the first one" }
     }).catch(function(){err.textContent="That didn't go through. Text DAILY instead.";go.disabled=false;go.textContent="Send me the first one"});
  });
}
function fallback(intro){
  B.innerHTML='<p>'+intro+'</p><p id="num">Text the word <b>DAILY</b> to my number and you are in.</p>';
  fetch(API+"api/public/number").then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok){document.getElementById("num").innerHTML='Text the word <b>DAILY</b> to <span class="phone">'+esc(j.pretty)+'</span><br><a class="btn" href="sms:'+esc(j.e164)+'&body=DAILY">Open my messages</a>'}
  }).catch(function(){})}
switch(s){
  case "sent": H.textContent=hi?"Check your phone, "+n+".":"Check your phone."; B.innerHTML="<p>I just sent you a text. Reply <b>YES</b> to it and your first morning arrives tomorrow.</p><p>Nothing to attend. Nothing to schedule. Nothing to catch up on if you miss one.</p>"; break;
  case "queued": H.textContent="You're on the list."; B.innerHTML="<p>"+esc(hi)+"It's a little early or a little late where you are, so my text will reach you at 7:30 your time. Reply <b>YES</b> to it and your first morning follows the next day.</p>"; break;
  case "invited": H.textContent="Look for my text."; B.innerHTML="<p>"+esc(hi)+"I already sent you one. Find it and reply <b>YES</b>, and your first morning arrives tomorrow.</p>"; break;
  case "already": H.textContent=hi?"You're already in, "+n+".":"You're already in."; B.innerHTML="<p>Your next morning is on its way. Nothing else to do.</p>"; break;
  case "optedout": H.textContent="You stepped away earlier."; fallback("No hard feelings. If you want back in, it takes one text."); break;
  case "nophone": H.textContent=n?"One more thing, "+n+".":"One more thing."; askPhone("The mornings arrive by text, so I need a mobile number."); break;
  case "nocontact": H.textContent="Let's do this the simple way."; fallback("That link didn't carry your details."); break;
  case "": H.textContent="Ten mornings. Ten minutes each."; askPhone("A short recording from me each morning, with one thing to do before the day starts. Nothing to attend, nothing to schedule, nothing to catch up on if you miss one. Enter your number and the first one arrives tomorrow morning."); break;
  case "needphone": H.textContent=n?"One more thing, "+n+".":"One more thing."; askPhone("The mornings arrive by text, so I need a mobile number. You'll get one text asking you to reply YES, and the first morning follows the next day."); break;
  default: H.textContent="Something didn't connect."; fallback("Not your fault. The simple way always works:");
}
</script></body></html>
