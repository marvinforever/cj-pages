<!doctype html>
<!--
  Every audio link in the texts looks like /d/<token>. There is no such file,
  so GitHub Pages serves this page, and all it does is hand the token to the
  one real player. It used to be a second copy of the player, and the two
  drifted: this copy never learned to wear a brand other than Christine's
  (2026-09-23, Shep saw the CJ monogram on his own series). One player now,
  so a fix to the player reaches every brand and every link.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Daily Whisper</title>
<script>
(function () {
  var m = location.pathname.match(/\/d\/([A-Za-z0-9]+)/);
  location.replace(m ? "/player.html#t=" + m[1] : "/");
})();
</script>
</head>
<body></body>
</html>
